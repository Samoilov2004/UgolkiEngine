# ──────────────────────────────────────────────────────────────────────────────
#  DQN Self-Play — training configuration
#  Designed for a quick first run on CPU (200 episodes, ~5-15 minutes).
# ──────────────────────────────────────────────────────────────────────────────

# Episode / game settings
episodes:   200       # total self-play episodes
max_moves:  300       # max half-moves per game before draw

# Replay buffer
replay_capacity: 50000
train_start_size: 1000   # start gradient updates once buffer reaches this size

# Mini-batch
batch_size: 64
train_every_steps: 1     # gradient step every N environment steps

# Optimisation
learning_rate: 0.0001
gamma: 0.99              # Bellman discount factor

# Target network
target_update_steps: 1000   # hard-copy online → target every N steps

# Epsilon schedule (linear decay)
epsilon_start: 1.0
epsilon_end:   0.05
epsilon_decay_steps: 20000  # steps over which epsilon decays from start→end

# Checkpointing
save_every: 50          # save model checkpoint every N episodes

# Compute
device: cpu             # "cpu" | "cuda" | "mps" | "auto"
seed: 42

# Output directory (logs go to output_dir/logs/, models to output_dir/models/)
output_dir: outputs

# Optional: path to an imitation-learning warm-start checkpoint.
# Set to the output of scripts/pretrain_imitation.py, or leave null to skip.
# init_checkpoint: outputs/models/imitation.pt
init_checkpoint: ~
