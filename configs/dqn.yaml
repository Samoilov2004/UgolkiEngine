# ─────────────────────────────────────────────
#  DQN + Self-Play — default configuration
# ─────────────────────────────────────────────

env:
  board_size: 8
  zone_size: 3          # 3×3 start/goal zones
  max_steps: 500        # max half-moves before draw
  reward:
    win: 1.0
    lose: -1.0
    draw: 0.0
    step_penalty: -0.001   # small penalty per step to encourage speed
    progress_bonus: 0.01   # bonus proportional to pieces closer to goal

agent:
  # Network
  hidden_dim: 256
  num_layers: 4
  # DQN hyperparameters
  gamma: 0.99
  lr: 1.0e-4
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 200_000
  target_update_freq: 1000   # steps between hard target-net updates
  double_dqn: true
  # Replay buffer
  buffer_size: 100_000
  batch_size: 256
  min_buffer_size: 5_000     # start training only after this many transitions

training:
  total_episodes: 50_000
  checkpoint_dir: checkpoints/
  checkpoint_interval: 1_000  # episodes
  log_interval: 100           # episodes
  device: auto                # "cpu" | "cuda" | "mps" | "auto"

self_play:
  enabled: true
  pool_size: 10               # number of past checkpoints kept in opponent pool
  swap_interval: 500          # episodes between opponent swaps
  win_rate_threshold: 0.55    # promote new checkpoint to pool if win-rate > this

evaluation:
  interval: 1_000             # episodes between evaluation rounds
  episodes_per_opponent: 100  # games played against each baseline
  opponents:
    - random
    - greedy

visualization:
  save_dir: plots/
  gif_fps: 4
